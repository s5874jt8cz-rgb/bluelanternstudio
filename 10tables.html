<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>10Tables | Blue Lantern Studio</title>
  <meta name="description" content="10 popular board games, all on your phone, completely offline and free. Coming soon.">
  <meta name="theme-color" content="#05080f">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Blue Lantern Studio">
  <meta property="og:title" content="10Tables">
  <meta property="og:description" content="10 popular board games, all on your phone, completely offline and free. Coming soon.">
  <meta property="og:image" content="https://bluelanternstudio.com/img/10tables-bg.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    @font-face { font-family: "Manrope"; font-weight: 700; font-display: swap; src: url("fonts/Manrope-Bold.ttf") format("truetype"); }
    @font-face { font-family: "Manrope"; font-weight: 800; font-display: swap; src: url("fonts/Manrope-ExtraBold.ttf") format("truetype"); }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; background: #05080f; }

    body {
      font-family: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: #fff;
    }

    /* One full-screen scene: the chess pieces in the fog, with the words along the top. */
    .scene {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      background: #05080f url("img/10tables-bg.jpg") center 62% / cover no-repeat;
    }

    /* Darkens the top so the words stay readable, and the very bottom for the footer line. */
    .scene::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to bottom, rgba(3, 6, 12, 0.72) 0%, rgba(3, 6, 12, 0.35) 30%, rgba(3, 6, 12, 0) 52%),
        linear-gradient(to top, rgba(3, 6, 12, 0.7) 0%, rgba(3, 6, 12, 0) 20%);
      pointer-events: none;
    }

    .top {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1100px;
      padding: clamp(36px, 8vh, 96px) 20px 0;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-weight: 800;
      font-size: clamp(2.2rem, 7vw, 5rem);
      line-height: 1.05;
      letter-spacing: -0.015em;
      text-wrap: balance;
      text-shadow: 0 2px 24px rgba(0, 0, 0, 0.6);
    }

    .lead {
      margin: 14px auto 0;
      max-width: 34ch;
      font-weight: 700;
      font-size: clamp(1.05rem, 2.6vw, 1.7rem);
      line-height: 1.35;
      color: #e4ebf5;
      text-shadow: 0 2px 16px rgba(0, 0, 0, 0.7);
      text-wrap: balance;
    }

    .soon {
      display: inline-block;
      margin-top: 22px;
      padding: 9px 22px;
      border: 2px solid rgba(255, 255, 255, 0.85);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      font-weight: 800;
      font-size: clamp(0.85rem, 1.9vw, 1.15rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .foot {
      position: relative;
      z-index: 1;
      margin-top: auto;
      padding: 28px 20px calc(24px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 0.92rem;
      font-weight: 700;
      color: #cfd8e6;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.8);
    }
    .foot a, .foot a:visited { color: #fff; text-underline-offset: 0.2em; display: inline-flex; align-items: center; min-height: 44px; }
    .foot a:hover, .foot a:focus-visible { color: #ffdead; }

    @media (prefers-reduced-motion: no-preference) {
      @keyframes rise { from { opacity: 0; translate: 0 18px; } to { opacity: 1; translate: 0 0; } }
      h1 { animation: rise 1s cubic-bezier(0.16, 1, 0.3, 1) both; }
      .lead { animation: rise 1s cubic-bezier(0.16, 1, 0.3, 1) 0.18s both; }
      .soon { animation: rise 1s cubic-bezier(0.16, 1, 0.3, 1) 0.36s both; }
    }

    @media (max-width: 700px) {
      .scene { background-position: 50% 70%; }
      .scene::before {
        background:
          linear-gradient(to bottom, rgba(3, 6, 12, 0.8) 0%, rgba(3, 6, 12, 0.4) 38%, rgba(3, 6, 12, 0) 60%),
          linear-gradient(to top, rgba(3, 6, 12, 0.7) 0%, rgba(3, 6, 12, 0) 20%);
      }
    }
  </style>
</head>
<body>
  <main class="scene">
    <header class="top">
      <h1>10 popular board games</h1>
      <p class="lead">All on your phone, completely offline and free</p>
      <span class="soon">Coming soon</span>
    </header>
    <footer class="foot">
      <a href="index.html">Back to Blue Lantern Studio</a>
      <span>&copy; 2026 Blue Lantern Studio</span>
    </footer>
  </main>
</body>
</html>
