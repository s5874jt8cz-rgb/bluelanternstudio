<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blue Lantern Studio</title>
  <meta name="description" content="Blue Lantern Studio makes apps and games. Start with Auto-Mobile or 10Tables.">
  <meta name="theme-color" content="#0b1220">
  <style>
    @font-face { font-family: "Manrope"; font-weight: 700; font-display: swap; src: url("fonts/Manrope-Bold.ttf") format("truetype"); }
    @font-face { font-family: "Manrope"; font-weight: 800; font-display: swap; src: url("fonts/Manrope-ExtraBold.ttf") format("truetype"); }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #0b1220;
    }

    body {
      font-family: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }

    /* The picture sets the size; the two cards sit on it by percentage. */
    .stage {
      container-type: inline-size;
      position: relative;
      width: 100%;
      max-width: 1600px;
      margin: 0 auto;
    }

    .stage > img {
      display: block;
      width: 100%;
      height: auto;
    }

    .card {
      position: absolute;
      top: 26.5%;
      width: 20%;
      aspect-ratio: 2.9;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.15em;
      padding: 0 4%;
      text-align: center;
      text-decoration: none;
      color: #10223f;
      font-weight: 800;
      font-size: clamp(0.9rem, 2.6cqw, 2.6rem);
      white-space: nowrap;
      line-height: 1.15;
      letter-spacing: 0.03em;
      text-shadow: 0 1px 8px rgba(255, 255, 255, 0.55);
      background: rgba(255, 255, 255, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 1.2cqw;
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      box-shadow: 0 0.6cqw 2cqw rgba(16, 34, 63, 0.18);
      transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
    }
    .card small {
      font-size: 0.5em;
      font-weight: 700;
      letter-spacing: 0.04em;
      opacity: 0.85;
    }
    .card.left { left: 14.4%; }
    .card.right { left: 87.5%; }

    .card:hover, .card:focus-visible {
      background: rgba(255, 255, 255, 0.4);
      transform: translate(-50%, -50%) scale(1.04);
      box-shadow: 0 0.8cqw 2.4cqw rgba(16, 34, 63, 0.28);
    }
    .card:focus-visible { outline: 3px solid #1b55d4; outline-offset: 3px; }

    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
      .card:hover, .card:focus-visible { transform: translate(-50%, -50%); }
    }

    /* Narrow screens: the cards would be too small on the picture, so they sit under it. */
    @media (max-width: 700px) {
      .stage { display: flex; flex-direction: column; gap: 16px; padding-bottom: 24px; }
      .card {
        position: static;
        transform: none;
        width: auto;
        aspect-ratio: auto;
        margin: 0 16px;
        padding: 20px 16px;
        font-size: 1.25rem;
        border-radius: 16px;
        color: #fff;
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.45);
      }
      .card:hover, .card:focus-visible { transform: none; background: rgba(255, 255, 255, 0.2); }
    }
  </style>
</head>
<body>
  <main class="stage">
    <img src="img/hub-desk.jpg" width="2400" height="1260" alt="A laptop on a wooden desk showing the Blue Lantern Studio logo, a glowing lantern in a golden arch, in front of a soft watercolor jungle.">
    <a class="card left" href="index-new.html"><span>Auto-Mobile</span><small>(click here)</small></a>
    <a class="card right" href="10tables.html"><span>10Tables</span><small>(click here)</small></a>
  </main>
</body>
</html>
