<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blue Lantern Studio</title>
  <meta name="description" content="Blue Lantern Studio is an independent studio making apps and games, starting with Auto-Mobile.">
  <meta name="theme-color" content="#ffffff">
  <link rel="canonical" href="https://bluelanternstudio.com/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Blue Lantern Studio">
  <meta property="og:title" content="Blue Lantern Studio">
  <meta property="og:description" content="An independent studio making apps and games, starting with Auto-Mobile.">
  <meta property="og:url" content="https://bluelanternstudio.com/">
  <meta property="og:image" content="https://bluelanternstudio.com/img/og-share.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    @font-face { font-family: "Manrope"; font-weight: 700; font-display: swap; src: url("fonts/Manrope-Bold.ttf") format("truetype"); }
    @font-face { font-family: "Manrope"; font-weight: 800; font-display: swap; src: url("fonts/Manrope-ExtraBold.ttf") format("truetype"); }

    * { box-sizing: border-box; }

    html {
      margin: 0;
      min-height: 100%;
      background: transparent; /* nothing painted behind the picture */
    }
    body { margin: 0; min-height: 100%; background: transparent; }

    body {
      font-family: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* The picture sets the size; the headline, pillars and cards sit on it by percentage. */
    .stage {
      container-type: inline-size;
      position: relative;
      width: 100%;
      max-width: 1600px;
      margin: auto;
    }

    .stage > img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Warm light around the laptop screen: the lantern is the brand. */
    .glow {
      position: absolute;
      left: 50%;
      top: 38%;
      width: 46%;
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(255, 205, 120, 0.3), rgba(255, 205, 120, 0) 62%);
      pointer-events: none;
      z-index: 1;
    }

    .hero {
      position: absolute;
      left: 50%;
      top: calc(3.5% + 2cqw);
      width: 70%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 3;
      color: #10223f;
      text-shadow: 0 0 1.4cqw rgba(255, 248, 230, 0.85), 0 0 0.5cqw rgba(255, 248, 230, 0.7);
    }
    .hero h1 {
      margin: 0;
      font-weight: 800;
      font-size: clamp(1.3rem, 3.6cqw, 3.6rem);
      line-height: 1.08;
      letter-spacing: -0.01em;
      text-wrap: balance;
    }
    .hero p {
      margin: 0.9cqw 0 0;
      font-weight: 700;
      font-size: clamp(0.8rem, 1.7cqw, 1.7rem);
      line-height: 1.35;
    }

    .card {
      position: absolute;
      z-index: 3;
      top: 51.5%;
      width: 20%;
      aspect-ratio: 2.3;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.2em;
      padding: 0 3%;
      text-align: center;
      text-decoration: none;
      color: #10223f;
      font-weight: 800;
      font-size: clamp(0.9rem, 2.4cqw, 2.4rem);
      white-space: nowrap;
      line-height: 1.15;
      letter-spacing: 0.03em;
      text-shadow: 0 1px 8px rgba(255, 255, 255, 0.55);
      background: rgba(255, 255, 255, 0.22);
      border: calc(2px + 2pt) solid #6b4f3a;
      border-radius: 1.2cqw;
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      box-shadow: 0 0 0 0.4cqw rgba(107, 79, 58, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.6), 0 1.2cqw 3cqw rgba(58, 46, 24, 0.16);
      transition: background 0.7s cubic-bezier(0.32, 0.72, 0, 1), transform 0.7s cubic-bezier(0.32, 0.72, 0, 1), box-shadow 0.7s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .card .desc { font-size: 0.42em; font-weight: 700; letter-spacing: 0.02em; }
    .card small { font-size: 0.5em; font-weight: 800; letter-spacing: 0.04em; }
    .card.left { left: 14.4%; }
    .card.right { left: 87.5%; }

    .card:hover, .card:focus-visible {
      background: rgba(255, 255, 255, 0.4);
      transform: translate(-50%, -50%) scale(1.04);
      box-shadow: 0 0.8cqw 2.4cqw rgba(16, 34, 63, 0.28);
    }
    .card:focus-visible { outline: 3px solid #1b55d4; outline-offset: 3px; }

    footer {
      display: none;
      margin-top: 0;
      padding: 28px 16px 40px;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-align: center;
      color: #10223f;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    footer a, footer a:visited { color: #ffdead; text-underline-offset: 0.2em; }
    footer a:hover, footer a:focus-visible { color: #fff; }

    /* Legal links sit on the desk, just under the laptop. */
    .legal {
      position: absolute;
      left: 50%;
      bottom: 5.3%;
      transform: translateX(-50%);
      z-index: 5;
      display: flex;
      justify-content: center;
      gap: 0 3cqw;
      font-weight: 700;
      font-size: clamp(0.7rem, 1.55cqw, 1.4rem);
      white-space: nowrap;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
    }
    .fine {
      position: absolute;
      left: 50%;
      bottom: 3%;
      transform: translateX(-50%);
      z-index: 5;
      margin: 0;
      font-weight: 700;
      font-size: clamp(0.62rem, 1.25cqw, 1.15rem);
      white-space: nowrap;
      color: #d9daae;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
    }
    .fine a, .fine a:visited { color: #f3e3a1; text-underline-offset: 0.2em; }
    .fine a:hover, .fine a:focus-visible { color: #fff; }
    .legal a, .legal a:visited { color: #f3e3a1; text-underline-offset: 0.2em; }
    .legal a:hover, .legal a:focus-visible { color: #fff; }
    footer p { margin: 0; }

    /* A gentle arrival and a slow glow, only for people who have not turned motion off. */
    @media (prefers-reduced-motion: no-preference) {
      @keyframes rise { from { opacity: 0; translate: 0 1.4cqw; } to { opacity: 1; translate: 0 0; } }
      @keyframes breathe { 0%, 100% { opacity: 0.75; } 50% { opacity: 1; } }
      .hero { animation: rise 1s cubic-bezier(0.16, 1, 0.3, 1) both; }
      .card.left { animation: rise 1s cubic-bezier(0.16, 1, 0.3, 1) 0.25s both; }
      .card.right { animation: rise 1s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both; }
      .glow { animation: breathe 7s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    }
    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
      .card:hover, .card:focus-visible { transform: translate(-50%, -50%); }
    }

    /* Narrow screens: headline on top, bigger crop of the picture, cards underneath. */
    @media (max-width: 700px) {
      /* Phone only: a very soft yellow to orange glow behind everything. */
      html {
        min-height: 100%;
        background: linear-gradient(180deg, #fffbe3 0%, #fff0c4 38%, #ffe0a8 72%, #ffd29a 100%) no-repeat;
        background-size: 100% 100%;
      }
      .stage { display: flex; flex-direction: column; gap: 16px; padding-bottom: 8px; }
      .hero {
        position: static;
        transform: none;
        width: auto;
        order: 0;
        padding: 28px 16px 4px;
        color: #10223f;
        text-shadow: none;
      }
      .hero h1 { font-size: 1.9rem; }
      .hero p { margin-top: 8px; font-size: 1rem; }
      .stage > img { order: 1; aspect-ratio: 4 / 3; object-fit: cover; object-position: 50% 38%; width: 100%; height: auto; }
      .glow { display: none; }
      .card {
        order: 2;
        position: static;
        transform: none;
        width: auto;
        aspect-ratio: auto;
        margin: 0 16px;
        padding: 18px 16px;
        font-size: 1.4rem;
        border-radius: 16px;
        background: rgba(255, 248, 230, 0.94);
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
      }
      .card .desc { font-size: 0.7em; }
      .card small { font-size: 0.62em; }
      .card:hover, .card:focus-visible { transform: none; background: #fff; }
      .legal {
        order: 3;
        position: static;
        transform: none;
        flex-wrap: wrap;
        gap: 0 20px;
        font-size: 0.95rem;
        padding: 8px 16px 0;
      }
      .legal a { display: inline-flex; align-items: center; min-height: 44px; }
      .fine { display: none; }
      footer { display: flex; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <img src="img/hub-desk.jpg" width="2400" height="1260" alt="A laptop on a wooden desk showing the Blue Lantern Studio logo, a glowing lantern in a golden arch, in front of a soft watercolor jungle.">
    <div class="glow" aria-hidden="true"></div>
    <header class="hero">
      <h1>Small studio. Big imagination.</h1>
      <p>Choose an app to learn more.</p>
    </header>
    <a class="card left" href="index-new.html"><span>Auto-Mobile</span><span class="desc">Vehicle maintenance tracker</span><small>click here</small></a>
    <a class="card right" href="10tables.html"><span>10Tables</span><span class="desc">A new game, coming soon</span><small>click here</small></a>
    <p class="fine">&copy; 2026 Blue Lantern Studio</p>
  </main>
  <footer>
    <p>&copy; 2026 Blue Lantern Studio</p>
  </footer>
</body>
</html>
