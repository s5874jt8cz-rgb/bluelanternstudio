main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 0 16px 16px; }

.logo { width: clamp(180px, 28vw, 300px); height: auto; }

.sub { margin: 34px 0 0; font-weight: 500; text-align: center; text-wrap: balance; font-size: clamp(1.1rem, 3vw, 2rem); }

.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: min(100%, 760px); }
.col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.tile {
  width: 100%; min-height: 96px; padding: 12px 8px;

  text-align: center; text-decoration: none; color: #000;
  background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.55); border-radius: 14px;
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
}
.tile:hover, .tile:focus-visible { background: rgba(255, 255, 255, 0.28); }
.tile b { font-weight: 700; font-size: clamp(0.8rem, 2.4vw, 1.7rem); letter-spacing: 0.1em; text-transform: uppercase; }
.tile span { font-weight: 500; font-size: clamp(0.65rem, 1.5vw, 1rem); letter-spacing: 0.06em; }
.dl { margin: 0; text-align: center; font-size: clamp(1.1rem, 3.2vw, 2rem); letter-spacing: 0.04em; }
.dl { white-space: nowrap; }
.dl b, .dl a { font-weight: 700; color: #000; text-underline-offset: 0.2em; }

.copy { margin: 0; padding: 0 16px 12px; text-align: center; font-weight: 500; font-size: 0.9rem; letter-spacing: 0.06em; }
@media (min-width: 701px) {
